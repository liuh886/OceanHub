name: Issue 49 closeout

on:
  push:
    branches:
      - fix/frontend-reliability-49

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/frontend-reliability-49
          fetch-depth: 0

      - name: Repair temporary exact-theme transformer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/issue49_patch.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('families = [')
          end = text.index("\nold = \"html[data-theme='light'] [class*='bg-[#0']", start)
          replacement = '''families = [
              (("bg-slate-950/", "bg-slate-900/"), '#ffffff'),
              (("bg-cyan-950/",), '#ecfeff'),
              (("bg-emerald-950/",), '#ecfdf5'),
              (("bg-blue-950/",), '#eff6ff'),
              (("bg-amber-950/",), '#fffbeb'),
          ]
          for prefixes, color in families:
              if len(prefixes) == 2:
                  old = "html[data-theme='light'] [class*='bg-slate-950/'],\\nhtml[data-theme='light'] [class*='bg-slate-900/'] {\\n  background-color: #ffffff !important;\\n}"
              else:
                  old = f"html[data-theme='light'] [class*='{prefixes[0]}'] {{\\n  background-color: {color} !important;\\n}}"
              if old not in theme:
                  raise RuntimeError(f'missing theme block for {prefixes}')
              selectors = tokens_for(*prefixes)
              replacement = '' if not selectors else ',\\n'.join(
                  f"html[data-theme='light'] [class~='{token}']" for token in selectors
              ) + f" {{\\n  background-color: {color} !important;\\n}}"
              theme = theme.replace(old, replacement, 1)
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Apply product patch
        run: python3 scripts/issue49_patch.py

      - name: Keep theme constants in one rendered DOM boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/layouts/Layout.astro')
          text = path.read_text(encoding='utf-8')
          old_html = '<html lang="en" data-theme="dark">'
          new_html = '<html lang="en" data-theme="dark" data-theme-storage-key={THEME_STORAGE_KEY} data-light-theme-color={LIGHT_THEME_COLOR} data-dark-theme-color={DARK_THEME_COLOR}>'
          if old_html not in text:
              raise RuntimeError('html theme boundary anchor missing')
          text = text.replace(old_html, new_html, 1)

          inline_tag = '<script is:inline define:vars={{ themeStorageKey: THEME_STORAGE_KEY, lightThemeColor: LIGHT_THEME_COLOR, darkThemeColor: DARK_THEME_COLOR }}>'
          if inline_tag not in text:
              raise RuntimeError('inline theme define-vars anchor missing')
          text = text.replace(inline_tag, '<script is:inline>', 1)
          inline_start = '''      (() => {\n        let storedTheme = null;'''
          inline_replacement = '''      (() => {\n        const root = document.documentElement;\n        const themeStorageKey = root.dataset.themeStorageKey;\n        const lightThemeColor = root.dataset.lightThemeColor;\n        const darkThemeColor = root.dataset.darkThemeColor;\n        if (!themeStorageKey || !lightThemeColor || !darkThemeColor) return;\n        let storedTheme = null;'''
          if inline_start not in text:
              raise RuntimeError('inline theme bootstrap anchor missing')
          text = text.replace(inline_start, inline_replacement, 1)
          text = text.replace('''        const root = document.documentElement;\n        root.dataset.theme = theme;''', '''        root.dataset.theme = theme;''', 1)

          processed_tag = '<script define:vars={{ themeStorageKey: THEME_STORAGE_KEY, lightThemeColor: LIGHT_THEME_COLOR, darkThemeColor: DARK_THEME_COLOR }}>'
          if processed_tag not in text:
              raise RuntimeError('processed theme define-vars anchor missing')
          text = text.replace(processed_tag, '<script>', 1)
          processed_start = '''    <script>\n      const themeMedia = window.matchMedia('(prefers-color-scheme: light)');'''
          processed_replacement = '''    <script>\n      const root = document.documentElement;\n      const themeStorageKey = root.dataset.themeStorageKey;\n      const lightThemeColor = root.dataset.lightThemeColor;\n      const darkThemeColor = root.dataset.darkThemeColor;\n      if (!themeStorageKey || !lightThemeColor || !darkThemeColor) throw new Error('OceanHub theme configuration is missing.');\n      const themeMedia = window.matchMedia('(prefers-color-scheme: light)');'''
          if processed_start not in text:
              raise RuntimeError('processed theme script anchor missing')
          text = text.replace(processed_start, processed_replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate product and browser contracts
        run: |
          npm run ci
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/oceanhub-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4321/OceanHub/ > /dev/null && break
            if [ "$attempt" -eq 30 ]; then cat /tmp/oceanhub-preview.log; exit 1; fi
            sleep 1
          done
          export OCEANHUB_TEST_BASE_URL=http://127.0.0.1:4321/OceanHub/
          npm run test:theme
          npm run test:conversion
          npm run test:scoper

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/issue49-closeout.yml' ':!scripts/issue49_patch.py'
          git diff --cached --quiet && exit 0
          git commit -m "fix(frontend): harden collaboration and theme boundaries"
          git push origin HEAD:fix/frontend-reliability-49
