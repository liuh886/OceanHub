name: Issue 49 closeout

on:
  push:
    branches:
      - fix/frontend-reliability-49

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/frontend-reliability-49
          fetch-depth: 0

      - name: Repair temporary exact-theme transformer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/issue49_patch.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('families = [')
          end = text.index("\nold = \"html[data-theme='light'] [class*='bg-[#0']", start)
          replacement = '''families = [
              (("bg-slate-950/", "bg-slate-900/"), '#ffffff'),
              (("bg-cyan-950/",), '#ecfeff'),
              (("bg-emerald-950/",), '#ecfdf5'),
              (("bg-blue-950/",), '#eff6ff'),
              (("bg-amber-950/",), '#fffbeb'),
          ]
          for prefixes, color in families:
              if len(prefixes) == 2:
                  old = "html[data-theme='light'] [class*='bg-slate-950/'],\\nhtml[data-theme='light'] [class*='bg-slate-900/'] {\\n  background-color: #ffffff !important;\\n}"
              else:
                  old = f"html[data-theme='light'] [class*='{prefixes[0]}'] {{\\n  background-color: {color} !important;\\n}}"
              if old not in theme:
                  raise RuntimeError(f'missing theme block for {prefixes}')
              selectors = tokens_for(*prefixes)
              if not selectors:
                  raise RuntimeError(f'no current source utility tokens found for {prefixes}')
              replacement = ',\\n'.join(f"html[data-theme='light'] [class~='{token}']" for token in selectors) + f" {{\\n  background-color: {color} !important;\\n}}"
              theme = theme.replace(old, replacement, 1)
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Apply product patch
        run: python3 scripts/issue49_patch.py

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate product and browser contracts
        run: |
          npm run ci
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/oceanhub-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4321/OceanHub/ > /dev/null && break
            if [ "$attempt" -eq 30 ]; then cat /tmp/oceanhub-preview.log; exit 1; fi
            sleep 1
          done
          export OCEANHUB_TEST_BASE_URL=http://127.0.0.1:4321/OceanHub/
          npm run test:theme
          npm run test:conversion
          npm run test:scoper

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/issue49-closeout.yml' ':!scripts/issue49_patch.py'
          git diff --cached --quiet && exit 0
          git commit -m "fix(frontend): harden collaboration and theme boundaries"
          git push origin HEAD:fix/frontend-reliability-49
