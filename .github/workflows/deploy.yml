name: Deploy validated OceanHub artifact

on:
  workflow_run:
    workflows: ["Validate OceanHub"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: oceanhub-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated site
        uses: actions/download-artifact@v4
        with:
          name: oceanhub-dist
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Package Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-deployment:
    name: Verify deployed Pages reachability
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Wait for Pages propagation
        shell: bash
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for attempt in {1..36}; do
            if curl -fsS -H 'Cache-Control: no-cache' "${PAGE_URL}?deployment=${DEPLOYED_SHA}" | grep -q 'OceanHub'; then
              echo "Pages is serving the deployed OceanHub shell."
              exit 0
            fi
            sleep 5
          done
          echo "Pages did not serve the deployed shell within the propagation window."
          exit 1

  report-deployment:
    name: Report deployed PWA status
    if: >-
      always() &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    needs: [deploy, verify-deployment]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish commit status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify-deployment.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_RESULT" == "success" && "$VERIFY_RESULT" == "success" ]]; then
            state=success
            description='GitHub Pages deployment and reachability check passed'
          else
            state=failure
            description='GitHub Pages deployment or reachability check failed'
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${DEPLOYED_SHA}" \
            -f state="$state" \
            -f context='pages/deployed-pwa' \
            -f description="$description" \
            -f target_url="$RUN_URL"
