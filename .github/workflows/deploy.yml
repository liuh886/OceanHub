name: Deploy validated OceanHub artifact

on:
  workflow_run:
    workflows: ["Validate OceanHub"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: oceanhub-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated site
        uses: actions/download-artifact@v4
        with:
          name: oceanhub-dist
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Package Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-deployment:
    name: Verify deployed PWA contract
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout the deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for Pages propagation
        shell: bash
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl -fsS -H 'Cache-Control: no-cache' "${PAGE_URL}?deployment=${DEPLOYED_SHA}" | grep -q 'OceanHub'; then
              echo "Pages is serving the deployed OceanHub shell."
              exit 0
            fi
            sleep 5
          done
          echo "Pages did not serve the deployed shell within the propagation window."
          exit 1

      - name: Test deployed PWA and offline Briefcase
        env:
          OCEANHUB_TEST_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          npm run test:deployed
          npm run test:briefcase
