name: Prepare dependency remediation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.event.pull_request.head.ref == 'agent/dependency-advisory-governance' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Migrate Astro content queries
        run: node scripts/migrate-astro-content-layer.mjs

      - name: Upgrade direct build dependencies
        run: |
          npm install --save-dev \
            astro@7.1.6 \
            @astrojs/react@4.4.2 \
            @tailwindcss/vite@4.1.18 \
            tailwindcss@4.1.18 \
            @types/react@19.2.9 \
            @types/react-dom@19.2.3 \
            sharp@0.35.3

      - name: Apply compatible transitive fixes
        run: npm audit fix --package-lock-only || true

      - name: Validate generated dependency graph
        run: |
          npm ci
          npm run ci

      - name: Commit validated remediation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No remediation changes were generated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/pages
          git commit -m 'chore: remediate dependency advisories'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
